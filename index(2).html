<style>

body {

.post-date { color: var(--muted); margin: -0.5rem 0 1.75rem; }
.post-body code, .post-body pre {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.88em;
}
.post-body code { background: var(--code); padding: 0.1em 0.3em; border-radius: 3px; }

.post-body img { max-width: 100%; height: auto; }
.post-body blockquote { margin: 1rem 0; padding-left: 1rem; border-left: 3px solid var(--rule); color: var(--muted); }
.post-body table { border-collapse: collapse; display: block; overflow-x: auto; }
.post-body th, .post-body td { border: 1px solid var(--rule); padding: 0.3rem 0.6rem; }
.post-nav { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
.post-nav p { margin: 0 0 0.4rem; }

.contact { padding-left: 1.2rem; }

footer { margin-top: 3rem; padding: 1rem 0 2.5rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: 0.9rem; }
footer p { margin: 0 0 0.4rem; }
footer a, footer a:visited { color: var(--muted); }
</style>

  data-title="Where the Q1.15 product actually lives"
  data-date="2026-09-20"
  data-summary="Multiplying two Q1.15 numbers gives Q2.30. Getting back to Q1.15 means bits [30:15], not [31:16]."
  data-project="fft"

[Intro: what the FFT is for, what broke, how you noticed.]

## The setup

[Q1.15, SB_MAC16, the twiddle multiply.]

## The bug

A Q1.15 × Q1.15 product is Q2.30. Bits 31 and 30 are the same sign bit except for (-1) × (-1), so the Q1.15 result is `[30:15]`:

```systemverilog
logic signed [15:0] a, b;   // Q1.15
logic signed [31:0] prod;   // Q2.30
logic signed [15:0] y;      // Q1.15

assign prod = a * b;
assign y    = prod[30:15];  // not prod[31:16]
```

[What [31:16] did to the output, and how the scoreboard caught it.]

<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<script>
(function () {
"use strict";

/* ============================== EDIT HERE ============================== */

const CONFIG = {
  name: "Max Zischka",
  photo: "",            // e.g. "images/me.jpg"; leave empty for no photo
  showDrafts: true,     // set to false before publishing
  email: "",            // e.g. "max@example.com"
  github: "https://github.com/MaxZischka1",
  linkedin: "",
  resume: "",           // e.g. "resume.pdf"

  // Homepage text (HTML). Rewrite this in your own words.
  intro: `
    <p>Hi, I'm Max. I'm a second-year Electrical Engineering student at McGill, minoring in Computer Science.</p>
    <p>I mostly work on FPGAs. I also co-lead the radio sub-team on the McGill Rocket Team, where we build the rocket's telemetry radios.</p>
    <p>This is where I write about what I'm working on.</p>
  `,

  // About page text (HTML).
  about: `
    <p>[A few lines about yourself.]</p>
  `,
};

// status: "current", "planned" or "done". Writeups link automatically from posts with a matching data-project.
const PROJECTS = [
  {
    id: "fft",
    name: "R2SDF FFT",
    status: "current",
    summary: "Pipelined radix-2 FFT in SystemVerilog for the iCE40 UP5K. Q1.15 fixed point on the SB_MAC16 DSP blocks, verified with a C++/Verilator testbench.",
    tools: "SystemVerilog, Verilator, C++",
    links: [{ label: "code", url: "" }],
  },
  {
    id: "sradio",
    name: "SRADIO",
    status: "current",
    summary: "Student-designed telemetry radio for the McGill Rocket Team, built around the SX1262.",
    tools: "",
    links: [],
  },
  {
    id: "gfsk",
    name: "GFSK telemetry link",
    status: "current",
    summary: "GFSK downlink for rocket telemetry: HopeRF transmitter on a Raspberry Pi Pico, received with GNU Radio on an SDR.",
    tools: "GNU Radio, Raspberry Pi Pico",
    links: [],
  },
  {
    id: "ethernet",
    name: "STM32 Ethernet board",
    status: "current",
    summary: "Ethernet board for an STM32. [details]",
    tools: "",
    links: [],
  },
  {
    id: "npu",
    name: "NPU",
    status: "planned",
    summary: "Neural processing unit on an Arty A7 for my AI course final project. Image in, class label out.",
    tools: "",
    links: [],
  },
  {
    id: "asic-re",
    name: "Netlist structure recovery",
    status: "done",
    summary: "Python pipeline that recovers word-level structure from a flattened gate-level netlist, for Jane Street's ASIC reverse-engineering challenge.",
    tools: "Python, KLayout, sky130",
    links: [{ label: "code", url: "" }],
  },
  {
    id: "four-bit",
    name: "4-bit computer",
    status: "done",
    summary: "4-bit computer on an FPGA, built on a MAX 10 and later ported to an iCE40.",
    tools: "",
    links: [{ label: "code", url: "" }],
  },
];

const EXPERIENCE = [
  { role: "Radio sub-team co-lead", org: "McGill Rocket Team", when: "[dates]" },
  { role: "B.Eng. Electrical Engineering, minor in Computer Science", org: "McGill University", when: "[dates]" },
  { role: "Tree planter", org: "[company]", when: "[dates]" },
];

// One is shown at random in the footer. Empty array = no quote.
const QUOTES = [
  { text: "What I cannot create, I do not understand.", who: "Richard Feynman" },
];

// Friends' sites for the footer, e.g. { name: "Sam", url: "https://..." }. Empty = hidden.
const FRIENDS = [];

/* =========================== END OF EDIT HERE =========================== */

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fmtDate(s) { const [y, m, d] = String(s).split("-").map(Number); return `${MONTHS[m - 1]} ${d}, ${y}`; }
function dedent(s) {
  s = s.replace(/^\n+/, "").replace(/\s+$/, "");
  const lines = s.split("\n");
  const ind = lines.filter((l) => l.trim()).map((l) => l.match(/^[ \t]*/)[0].length);
  const min = ind.length ? Math.min(...ind) : 0;
  return lines.map((l) => l.slice(min)).join("\n");
}
const links = (arr) => (arr || []).filter((l) => l.url).map((l) => `<a href="${esc(l.url)}">${esc(l.label)}</a>`);

const POSTS = Array.from(document.querySelectorAll('script[type="text/markdown"]'))
  .map((el) => ({
    slug: el.dataset.slug,
    title: el.dataset.title || el.dataset.slug,
    date: el.dataset.date || "1970-01-01",
    summary: el.dataset.summary || "",
    project: el.dataset.project || "",
    draft: el.dataset.draft === "true",
    md: dedent(el.textContent).replace(/<\\\/script>/g, "<\/script>"),
  }))
  .filter((p) => p.slug && (CONFIG.showDrafts || !p.draft))
  .sort((a, b) => b.date.localeCompare(a.date));

function markdown(md) {
  if (window.marked && typeof window.marked.parse === "function") {
    return window.marked.parse(md, { headerIds: false, mangle: false });
  }
  return md.split(/\n```[^\n]*\n([\s\S]*?)\n```/).map((chunk, i) => i % 2
    ? `<pre><code>${esc(chunk)}</code></pre>`
    : chunk.split(/\n{2,}/).filter((b) => b.trim()).map((b) => {
        const h = b.match(/^(#{2,3})\s+(.*)/);
        return h ? `<h${h[1].length}>${esc(h[2])}</h${h[1].length}>` : `<p>${esc(b)}</p>`;
      }).join("")).join("");
}

function postList(posts) {
  if (!posts.length) return `<p class="muted">No posts yet.</p>`;
  return `<ul class="posts">${posts.map((p) => `<li>
    <span class="date">${fmtDate(p.date)}</span><a href="#/blog/${encodeURIComponent(p.slug)}">${esc(p.title)}</a>${p.draft ? ' <span class="muted">(draft)</span>' : ""}
    ${p.summary ? `<p class="summary">${esc(p.summary)}</p>` : ""}
  </li>`).join("")}</ul>`;
}

function project(p) {
  const all = links(p.links).concat(
    POSTS.filter((x) => x.project === p.id).map((w) => `<a href="#/blog/${encodeURIComponent(w.slug)}">writeup</a>`)
  );
  return `<div class="project" id="project-${esc(p.id)}">
    <h3>${esc(p.name)}</h3>
    <p>${esc(p.summary)}</p>
    ${p.tools || all.length ? `<p class="meta">${p.tools ? esc(p.tools) : ""}${p.tools && all.length ? " | " : ""}${all.join(", ")}</p>` : ""}
  </div>`;
}

const views = {
  home() {
    const current = PROJECTS.filter((p) => p.status === "current");
    return `
      <h1 class="sr-only">${esc(CONFIG.name)}</h1>
      <div class="intro">
        ${CONFIG.photo ? `<img class="photo" src="${esc(CONFIG.photo)}" alt="Photo of ${esc(CONFIG.name)}">` : ""}
        ${CONFIG.intro}
      </div>
      <h2>Recent posts</h2>
      ${postList(POSTS.slice(0, 5))}
      ${current.length ? `<h2>Working on</h2>
        <ul>${current.map((p) => `<li><a href="#/projects/${encodeURIComponent(p.id)}">${esc(p.name)}</a></li>`).join("")}</ul>` : ""}
    `;
  },
  blog() {
    return `<h1>Blog</h1>${postList(POSTS)}`;
  },
  projects() {
    const groups = [["current", "Current"], ["planned", "Planned"], ["done", "Done"]];
    return `<h1>Projects</h1>${groups.map(([k, label]) => {
      const ps = PROJECTS.filter((p) => p.status === k);
      return ps.length ? `<h2>${label}</h2>${ps.map(project).join("")}` : "";
    }).join("")}`;
  },
  post(slug) {
    const i = POSTS.findIndex((p) => p.slug === slug);
    if (i < 0) return null;
    const p = POSTS[i], newer = POSTS[i - 1], older = POSTS[i + 1];
    const proj = p.project && PROJECTS.find((x) => x.id === p.project);
    return `
      <h1>${esc(p.title)}</h1>
      <p class="post-date">${fmtDate(p.date)}${p.draft ? " (draft)" : ""}${proj ? ` | <a href="#/projects/${encodeURIComponent(proj.id)}">${esc(proj.name)}</a>` : ""}</p>
      <div class="post-body">${markdown(p.md)}</div>
      ${newer || older ? `<div class="post-nav">
        ${newer ? `<p>Newer: <a href="#/blog/${encodeURIComponent(newer.slug)}">${esc(newer.title)}</a></p>` : ""}
        ${older ? `<p>Older: <a href="#/blog/${encodeURIComponent(older.slug)}">${esc(older.title)}</a></p>` : ""}
      </div>` : ""}
    `;
  },
  about() {
    const contact = [
      CONFIG.email && `<li>Email: <a href="mailto:${esc(CONFIG.email)}">${esc(CONFIG.email)}</a></li>`,
      CONFIG.github && `<li>GitHub: <a href="${esc(CONFIG.github)}">${esc(CONFIG.github.replace(/^https?:\/\//, ""))}</a></li>`,
      CONFIG.linkedin && `<li>LinkedIn: <a href="${esc(CONFIG.linkedin)}">${esc(CONFIG.linkedin.replace(/^https?:\/\/(www\.)?/, ""))}</a></li>`,
      CONFIG.resume && `<li><a href="${esc(CONFIG.resume)}">Résumé (PDF)</a></li>`,
    ].filter(Boolean);
    return `
      <h1>About</h1>
      ${CONFIG.about}
      ${EXPERIENCE.length ? `<h2>Experience</h2><ul>${EXPERIENCE.map((e) =>
        `<li><strong>${esc(e.role)}</strong>, ${esc(e.org)} <span class="muted">${esc(e.when)}</span></li>`).join("")}</ul>` : ""}
      ${contact.length ? `<h2>Contact</h2><ul class="contact">${contact.join("")}</ul>` : ""}
    `;
  },
  notFound() {
    return `<h1>Not found</h1><p>Nothing here. Go to the <a href="#/">homepage</a>.</p>`;
  },
};

const main = document.getElementById("main");
let first = true;

function route() {
  const h = location.hash.startsWith("#/") ? location.hash.slice(2) : "";
  const parts = h.split("/").filter(Boolean).map((x) => { try { return decodeURIComponent(x); } catch (e) { return x; } });
  if (!parts.length) return { name: "home" };
  if (parts[0] === "blog" && parts.length === 1) return { name: "blog" };
  if (parts[0] === "blog" && parts.length === 2) return { name: "post", slug: parts[1] };
  if (parts[0] === "projects" && parts.length <= 2) return { name: "projects", id: parts[1] };
  if (parts[0] === "about" && parts.length === 1) return { name: "about" };
  return { name: "notFound" };
}

function render() {
  const r = route();
  let html = r.name === "post" ? views.post(r.slug) : views[r.name]();
  let title = { home: "", blog: "Blog", projects: "Projects", about: "About", notFound: "Not found" }[r.name];
  if (r.name === "post") {
    if (html) title = POSTS.find((p) => p.slug === r.slug).title;
    else { html = views.notFound(); title = "Not found"; }
  }
  main.innerHTML = html;
  document.title = title ? `${title} | ${CONFIG.name}` : CONFIG.name;

  const section = r.name === "post" ? "blog" : r.name;
  document.querySelectorAll("[data-nav]").forEach((a) =>
    a.dataset.nav === section ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));

  const q = QUOTES.length ? QUOTES[Math.floor(Math.random() * QUOTES.length)] : null;
  const qEl = document.getElementById("quote");
  qEl.hidden = !q;
  if (q) qEl.textContent = `"${q.text}" (${q.who})`;

  const target = r.id && document.getElementById("project-" + r.id);
  if (target) target.scrollIntoView();
  else if (!first) window.scrollTo(0, 0);
  if (!first) {
    const h1 = main.querySelector("h1");
    if (h1) { h1.setAttribute("tabindex", "-1"); h1.focus({ preventScroll: true }); }
  }
  first = false;
}

document.getElementById("site-name").textContent = CONFIG.name;
const footerBits = [`© ${new Date().getFullYear()} ${esc(CONFIG.name)}`];
if (CONFIG.github) footerBits.push(`<a href="${esc(CONFIG.github)}">GitHub</a>`);
if (CONFIG.email) footerBits.push(`<a href="mailto:${esc(CONFIG.email)}">Email</a>`);
document.getElementById("footer-line").innerHTML = footerBits.join(" | ");
if (FRIENDS.length) {
  const fr = document.getElementById("friends");
  fr.hidden = false;
  fr.innerHTML = "Friends: " + FRIENDS.map((f) => `<a href="${esc(f.url)}">${esc(f.name)}</a>`).join(", ");
}

window.addEventListener("hashchange", () => { if (!location.hash || location.hash.startsWith("#/")) render(); });
render();
})();
</script>
</body>
